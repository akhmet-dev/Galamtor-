<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>Galamtor бұлттық жүйесі — Синхрондау</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
  <script src="/auth-flow.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 242, 254, 0.1);
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 242, 254, 0.3);
    }
    h2 {
      background: linear-gradient(135deg, #ffffff 30%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 24px;
    }
    #status {
      color: rgba(255,255,255,0.75);
      font-size: 15px;
      margin-top: 12px;
    }
    .setup-help {
      margin: 12px auto 0;
      color: #f4d28a;
      font-size: 13px;
      line-height: 1.55;
    }
    #logs {
      margin: 10px auto 0;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      color: #8e9eab;
      text-align: left;
      width: 100%;
      background: rgba(0,0,0,0.4);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .diagnostics {
      margin-top: 20px;
      text-align: left;
    }
    .diagnostics summary {
      color: rgba(255,255,255,0.48);
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0,242,254,0.15);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin: 16px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #spinner { display: none; }
    .auth-action { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #07090e; border: 0; padding: 11px 20px; font: inherit; font-size: 14px; font-weight: 600; border-radius: 20px; cursor: pointer; }
    #cancel-btn { background: transparent; color: #c2cbd4; border: 1px solid #40505d; }
    .auth-action:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .back-link:hover {
      color: #00f2fe;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <img src="assets/icon.png" alt="Galamtor" class="brand-icon" onerror="this.style.display='none'">
    <h2>Galamtor Синхрондау хабы</h2>
    <div id="spinner" class="spinner"></div>
    <p id="status" role="status" aria-live="polite">Байланыс орнатылуда...</p>
    <p id="setup-help" class="setup-help" role="alert" hidden></p>
    <div id="retry-container" style="margin-top: 20px; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;"></div>
    <details class="diagnostics">
      <summary>Техникалық мәліметтер</summary>
      <div id="logs">[Logs Initialized]</div>
    </details>
    <a href="/" class="back-link">← Ресми сайтқа қайту</a>
  </div>

  <script src="/async-operations.js?v=1.5.1"></script>
  <script src="/auth-page.js?v=1.5.1"></script>
</body>
</html>
